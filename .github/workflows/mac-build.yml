name: Mac Test App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package-mac:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow numpy opencv-python-headless pyembroidery
      - name: Validate code and test engine
        run: |
          python -m compileall -q mac_app.py digitizer
          python -m unittest discover -s tests -v
          python review_pes.py
      - name: Package Mac application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "Deathwish Digitizer 2 Test" \
            --collect-all cv2 --collect-all pyembroidery \
            --hidden-import PIL._tkinter_finder \
            mac_app.py
          test -f "dist/Deathwish Digitizer 2 Test.app/Contents/MacOS/Deathwish Digitizer 2 Test"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "dist/Deathwish Digitizer 2 Test.app" "Deathwish-Digitizer-2-Mac-Test.zip"
          unzip -t "Deathwish-Digitizer-2-Mac-Test.zip" | tail -1
      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: deathwish-digitizer-2-mac-test
          path: Deathwish-Digitizer-2-Mac-Test.zip
          if-no-files-found: error
