name: Mac Test App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-mac:
    # Build a Mac .app launcher on Ubuntu, avoiding GitHub's unavailable
    # macOS runners. On first launch, the app installs Python dependencies
    # into the user's Application Support directory.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test digitizer
        run: |
          python -m pip install pillow numpy opencv-python-headless pyembroidery
          python -m compileall -q mac_app.py digitizer
          python -m unittest discover -s tests -v
          python review_pes.py
      - name: Assemble Mac application without Mac runner
        run: |
          python packaging/build_portable_mac.py
          unzip -t Deathwish-Digitizer-2-Mac-Test.zip | tail -1
          python packaging/verify_portable_mac.py Deathwish-Digitizer-2-Mac-Test.zip
      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: deathwish-digitizer-2-mac-test
          path: Deathwish-Digitizer-2-Mac-Test.zip
          if-no-files-found: error
