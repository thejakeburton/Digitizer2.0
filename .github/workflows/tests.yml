
name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy opencv-python-headless pyembroidery
      - run: python -m unittest discover -s tests -v
      - run: python main.py --out output
      - run: python main.py --shape polygon-rectangle --out output
      - run: python main.py --shape l-shape --out output
      - run: python main.py --shape donut --out output
      - run: python review_pes.py
      - uses: actions/upload-artifact@v4
        with:
          name: pes-stitch-review
          path: review-output/
          if-no-files-found: error
